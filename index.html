<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIR Dinamis SI-ASEP - Satpol PP Kota Serang</title>
  
  <style>
    /* RESET & BASE STYLES */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
    body { background-color: #f1f5f9; color: #1e293b; padding-bottom: 30px; }

    /* HEADER BERSAMA LOGO */
    .site-header {
      background: #ffffff;
      border-bottom: 3px solid #0284c7;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      margin-bottom: 20px;
    }
    .logo-box img { max-height: 60px; width: auto; }
    .header-title { text-align: center; flex: 1; padding: 0 10px; }
    .header-title h1 { font-size: 1.2rem; font-weight: bold; color: #0f172a; margin-bottom: 4px; }
    .header-title p { font-size: 0.85rem; color: #64748b; font-weight: bold; }

    /* KONTROL UTAMA (NAVIGASI & PENCARIAN) */
    .kontrol-container { max-width: 1200px; margin: 0 auto; padding: 0 15px; }
    
    .nav-ruangan {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
      justify-content: center;
    }
    .btn-nav {
      background: #1e293b; color: #fff; border: none; padding: 8px 16px;
      border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    .btn-nav:hover { background: #0284c7; }
    .btn-nav.active { background: #d97706; box-shadow: 0 4px 10px rgba(217,119,6,0.3); }

    .toolbar-aksi {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 20px;
      gap: 15px;
    }
    .toolbar-aksi h2 { font-size: 1.1rem; color: #0284c7; }
    
    .search-box {
      display: flex; align-items: center; width: 100%; max-width: 350px;
    }
    .search-box input {
      width: 100%; padding: 10px 15px; border: 1px solid #cbd5e1;
      border-radius: 20px; outline: none; font-size: 0.9rem; transition: 0.3s;
    }
    .search-box input:focus { border-color: #0284c7; box-shadow: 0 0 0 3px rgba(2,132,199,0.1); }

    /* TABEL RESPONSIF */
    .table-responsive {
      width: 100%;
      overflow-x: auto; /* Kunci agar bisa digeser di HP */
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .tabel-barang { width: 100%; border-collapse: collapse; min-width: 900px; font-size: 11px; }
    .tabel-barang th, .tabel-barang td { border: 1px solid #cbd5e1; padding: 8px; vertical-align: middle; }
    .tabel-barang th { background-color: #f8fafc; font-weight: bold; text-align: center; }
    .tabel-barang tr:nth-child(even) { background-color: #f1f5f9; }
    .tabel-barang tr:hover { background-color: #e0f2fe; }
    
    .text-center { text-align: center; }
    .text-right { text-align: right; }

    #status-loading { text-align: center; padding: 30px; font-weight: bold; color: #0284c7; font-size: 1rem; }

    /* RESPONSIVE LAYOUT (HP) */
    @media (max-width: 600px) {
      .site-header { padding: 10px; }
      .logo-box img { max-height: 45px; }
      .header-title h1 { font-size: 0.95rem; }
      .header-title p { font-size: 0.7rem; }
      .nav-ruangan { justify-content: flex-start; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 5px; }
      .btn-nav { white-space: nowrap; font-size: 0.8rem; padding: 6px 12px; }
    }
  </style>
</head>
<body>

  <!-- HEADER DENGAN LOGO -->
  <header class="site-header">
    <div class="logo-box">
      <!-- Pastikan file logo tersedia di folder yang sama -->
      <img src="kotaserang.png" alt="Logo Serang">
    </div>
    <div class="header-title">
      <h1>KARTU INVENTARIS RUANGAN</h1>
      <p>Satuan Polisi Pamong Praja Kota Serang</p>
    </div>
    <div class="logo-box">
      <img src="polpp.png" alt="Logo Satpol PP">
    </div>
  </header>

  <div class="kontrol-container">
    
    <!-- TOMBOL NAVIGASI RUANGAN -->
    <div class="nav-ruangan" id="navigasi-ruangan">
      <!-- Tambahkan atau ubah nama ruangan sesuai nama Tab (Sheet) di Google Sheets Anda -->
      <button class="btn-nav active" onclick="gantiRuangan('GUDANG', this)">GUDANG</button>
      <button class="btn-nav" onclick="gantiRuangan('KASAT', this)">KASAT</button>
      <button class="btn-nav" onclick="gantiRuangan('UMPEG', this)">UMPEG</button>
      <button class="btn-nav" onclick="gantiRuangan('KEUANGAN', this)">KEUANGAN</button>
      <button class="btn-nav" onclick="gantiRuangan('SEKRETARIS', this)">SEKRETARIS</button>
      <button class="btn-nav" onclick="gantiRuangan('TRANTIBUM', this)">TRANTIBUM</button>
    </div>

    <!-- PENCARIAN & JUDUL TABEL -->
    <div class="toolbar-aksi">
      <h2 id="judul-ruangan">📍 Ruangan: GUDANG</h2>
      <div class="search-box">
        <input type="text" id="inputPencarian" placeholder="🔍 Cari Barang, Merek, atau Kode..." onkeyup="cariDataBarang()">
      </div>
    </div>

    <div id="status-loading">🔄 Menarik Data dari Database...</div>

    <!-- WADAH TABEL (BISA DI-SCROLL DI HP) -->
    <div class="table-responsive">
      <table class="tabel-barang" id="tabel-utama" style="display: none;">
        <thead>
          <tr>
            <th rowspan="2" width="3%">No.</th>
            <th rowspan="2" width="18%">Jenis Barang / Nama Barang</th>
            <th rowspan="2" width="12%">Merek / Model</th>
            <th rowspan="2" width="8%">No. Seri Pabrik</th>
            <th rowspan="2" width="6%">Ukuran</th>
            <th rowspan="2" width="6%">Bahan</th>
            <th rowspan="2" width="5%">Tahun</th>
            <th rowspan="2" width="10%">No. Kode Barang</th>
            <th rowspan="2" width="9%">Harga Beli</th>
            <th colspan="3">Keadaan</th>
            <th rowspan="2" width="10%">Keterangan</th>
          </tr>
          <tr>
            <th width="4%">B</th>
            <th width="4%">KB</th>
            <th width="4%">RB</th>
          </tr>
        </thead>
        <tbody id="tabel-body-kir">
          <!-- Data Hasil Fetch / Pencarian -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // ID SPREADSHEET (Tetap sama)
    const SHEET_ID = '1A4xCPByCydWjU5E8FsckHyXrRy3UPZFjsGlx86NdVY4'; 
    
    // Variabel Global untuk menyimpan data mentah ruangan saat ini
    let dataBarangAktif = []; 

    // Fungsi Mengganti Ruangan
    function gantiRuangan(namaTab, elemenTombol) {
      // 1. Ubah warna tombol aktif
      const tombolSemua = document.querySelectorAll('.btn-nav');
      tombolSemua.forEach(btn => btn.classList.remove('active'));
      elemenTombol.classList.add('active');

      // 2. Ubah Judul
      document.getElementById('judul-ruangan').innerText = `📍 Ruangan: ${namaTab}`;
      
      // 3. Reset Pencarian
      document.getElementById('inputPencarian').value = '';

      // 4. Tarik data dari Tab tersebut
      tarikDataSheets(namaTab);
    }

    // Fungsi Utama Menarik Data Google Sheets
    function tarikDataSheets(namaTab) {
      document.getElementById('tabel-utama').style.display = 'none';
      document.getElementById('status-loading').style.display = 'block';
      document.getElementById('status-loading').innerText = `🔄 Menarik Data Ruangan ${namaTab}...`;
      
      const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${namaTab}&tqx=out:json`;

      fetch(URL)
        .then(res => res.text())
        .then(text => {
          const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
          const data = JSON.parse(jsonString);
          const barisData = data.table.rows;
          
          dataBarangAktif = []; // Kosongkan data lama

          // Proses baris per baris
          for(let i = 0; i < barisData.length; i++) {
            const kolom = barisData[i].c;
            if (!kolom) continue;

            const no = (kolom[0] && kolom[0].v !== null) ? String(kolom[0].v) : "";
            const nama = (kolom[1] && kolom[1].v !== null) ? String(kolom[1].v) : "";
            if (no === "" && nama === "") continue; 

            // Simpan ke dalam array Object
            dataBarangAktif.push({
              no: no,
              nama: nama,
              merek: (kolom[2] && kolom[2].v !== null) ? String(kolom[2].v) : "",
              seri: (kolom[3] && kolom[3].v !== null) ? String(kolom[3].v) : "",
              ukuran: (kolom[4] && kolom[4].v !== null) ? String(kolom[4].v) : "",
              bahan: (kolom[5] && kolom[5].v !== null) ? String(kolom[5].v) : "",
              tahun: (kolom[6] && kolom[6].v !== null) ? String(kolom[6].v) : "",
              kode: (kolom[7] && kolom[7].v !== null) ? String(kolom[7].v) : "",
              harga: kolom[8] ? (kolom[8].f ? kolom[8].f : (kolom[8].v !== null ? String(kolom[8].v) : "")) : "",
              b: (kolom[9] && kolom[9].v !== null) ? String(kolom[9].v) : "",
              kb: (kolom[10] && kolom[10].v !== null) ? String(kolom[10].v) : "",
              rb: (kolom[11] && kolom[11].v !== null) ? String(kolom[11].v) : "",
              ket: (kolom[12] && kolom[12].v !== null) ? String(kolom[12].v) : ""
            });
          }

          // Tampilkan tabel awal (tanpa filter)
          renderTabelHTML(dataBarangAktif);
        })
        .catch(error => {
          document.getElementById('status-loading').innerHTML = `❌ Gagal mengambil data Ruangan ${namaTab}. Pastikan nama Tab di Excel ejaan dan spasinya sama persis.`;
          console.error("Error:", error);
        });
    }

    // Fungsi Render HTML Tabel
    function renderTabelHTML(arrayData) {
      const tbody = document.getElementById("tabel-body-kir");
      let htmlTabel = "";

      if (arrayData.length === 0) {
        htmlTabel = `<tr><td colspan="13" class="text-center" style="padding:20px; font-weight:bold; color:red;">Barang tidak ditemukan di ruangan ini.</td></tr>`;
      } else {
        arrayData.forEach(item => {
          htmlTabel += `
            <tr>
              <td class="text-center">${item.no}</td>
              <td><strong>${item.nama}</strong></td>
              <td>${item.merek}</td>
              <td>${item.seri}</td>
              <td>${item.ukuran}</td>
              <td>${item.bahan}</td>
              <td class="text-center">${item.tahun}</td>
              <td class="text-center">${item.kode}</td>
              <td class="text-right">${item.harga}</td>
              <td class="text-center">${item.b}</td>
              <td class="text-center">${item.kb}</td>
              <td class="text-center">${item.rb}</td>
              <td>${item.ket}</td>
            </tr>
          `;
        });
      }

      tbody.innerHTML = htmlTabel;
      document.getElementById('status-loading').style.display = 'none';
      document.getElementById('tabel-utama').style.display = 'table';
    }

    // Fungsi Fitur Pencarian Cerdas Instan (Search Bar)
    function cariDataBarang() {
      const kataKunci = document.getElementById('inputPencarian').value.toLowerCase();
      
      // Filter array data mentah berdasarkan kecocokan nama, merek, atau kode register
      const hasilPencarian = dataBarangAktif.filter(item => {
        return item.nama.toLowerCase().includes(kataKunci) || 
               item.kode.toLowerCase().includes(kataKunci) ||
               item.merek.toLowerCase().includes(kataKunci);
      });

      // Cetak ulang tabel hanya dengan hasil pencarian
      renderTabelHTML(hasilPencarian);
    }

    // Tarik data Ruangan GUDANG otomatis saat web pertama kali dibuka
    window.onload = function() {
      tarikDataSheets('GUDANG');
    };
  </script>

</body>
</html>
